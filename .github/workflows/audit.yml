name: audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the linter
        uses: actions/checkout@v4
        with:
          repository: JoaoPeixoto72/skill-auditor
          path: .skill-auditor
      - name: Run structural audit
        # Aponta ao ficheiro, nao a pasta: varrer o workspace apanhava tambem
        # o SKILL.md do proprio linter. E o dirname da' `design-pro`, que e' o
        # que o linter compara com o campo `name:`.
        run: |
          bash .skill-auditor/scripts/audit.sh "$GITHUB_WORKSPACE/SKILL.md" | tee audit.out
          if grep -E "^\s*-\s*\[(Blocker|Major)\]" audit.out; then
            echo "::error::skill-auditor found Blocker/Major findings (see log above)."
            exit 1
          fi
